fillSelect(document.getElementById("school"), SCHOOLS);
fillSelect(document.getElementById("dept"), DEPTS);

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function haystack(p) {
  return [
    p.name, p.name_local, p.school, p.department, p.title, p.subject,
    p.summary, (p.research_directions||[]).join(" "),
    (p.focus_areas||[]).join(" "),
    (p.publications||[]).map(x => x.title + " " + (x.venue||"")).join(" ")
  ].join(" ").toLowerCase();
}

function render(p) {
  const chips = [];
  for (const d of (p.research_directions||[])) chips.push(`<span class="chip topic">${esc(d)}</span>`);
  for (const f of (p.focus_areas||[])) chips.push(`<span class="chip">${esc(f)}</span>`);

  let pubs = "";
  const pl = (p.publications||[]).slice(0,5);
  if (pl.length) {
    const items = pl.map(x => {
      const meta = [x.venue, x.year].filter(Boolean).join(", ");
      const cite = x.citations != null ? ` &middot; ${esc(x.citations)} cites` : "";
      return `<li>${esc(x.title)}${meta ? ` <span class="venue">${esc(meta)}</span>` : ""}${cite}</li>`;
    }).join("");
    pubs = `<div class="section-label">Selected publications</div><ul class="pubs">${items}</ul>`;
  }

  const links = [];
  if (p.homepage) links.push(`<a class="primary" href="${esc(p.homepage)}" target="_blank" rel="noopener">Homepage ↗</a>`);
  if (p.profile_url) links.push(`<a href="${esc(p.profile_url)}" target="_blank" rel="noopener">University profile</a>`);
  if (p.scholar_url) links.push(`<a href="${esc(p.scholar_url)}" target="_blank" rel="noopener">Google Scholar</a>`);
  if (p.email) links.push(`<a href="mailto:${esc(p.email)}">Email</a>`);

  const conf = p.confidence === "fine"
    ? '<span class="badge fine">verified profile</span>'
    : '<span class="badge coarse">roster only</span>';
  const unver = p.verified === false ? '<span class="badge unverified">needs review</span>' : "";

  const local = p.name_local ? `<span class="local">${esc(p.name_local)}</span>` : "";
  const affil = [p.department, p.school].filter(Boolean).join(" · ");
  const summary = p.summary ? `<div class="summary">${esc(p.summary)}</div>` : "";
  const subj = p.subject ? `<span class="chip">${esc(p.subject)}</span>` : "";

  return `<article class="card">
    <div class="card-top">
      <h2>${esc(p.name)}${local}</h2>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${conf}${unver}</div>
    </div>
    ${p.title ? `<div class="role">${esc(p.title)}</div>` : ""}
    ${affil ? `<div class="affil">${esc(affil)}</div>` : ""}
    ${summary}
    ${(subj || chips.length) ? `<div class="chips">${subj}${chips.join("")}</div>` : ""}
    ${pubs}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
  </article>`;
}

let state = { q: "", school: "", dept: "", sort: "name" };

function apply() {
  const q = state.q.toLowerCase().trim();
  let list = professors.filter(p => {
    if (state.school && p.school !== state.school) return false;
    if (state.dept && p.department !== state.dept) return false;
    if (q && !haystack(p).includes(q)) return false;
    return true;
  });
  const key = { name: p => (p.name||"").toLowerCase(),
                school: p => (p.school||"").toLowerCase(),
                title: p => (p.title||"").toLowerCase() }[state.sort];
  list.sort((a,b) => key(a).localeCompare(key(b)));

  document.getElementById("grid").innerHTML = list.map(render).join("");
  document.getElementById("shown").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  const filters = [];
  if (state.school) filters.push(state.school);
  if (state.dept) filters.push(state.dept);
  document.getElementById("meta").textContent =
    `Showing ${list.length} of ${professors.length}` + (filters.length ? " · " + filters.join(" · ") : "");
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; apply(); });
document.getElementById("school").addEventListener("change", e => { state.school = e.target.value; apply(); });
document.getElementById("dept").addEventListener("change", e => { state.dept = e.target.value; apply(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; apply(); });

apply();
</script>
</body>
</html>
